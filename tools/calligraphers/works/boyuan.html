<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伯远帖 · 历代书家谱</title>
<style>
:root {
  --ink: #2b2620;
  --paper: #f7f2e8;
  --cinnabar: #a83232;
  --muted: #7a7062;
  --line: #ddd3c0;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.9 "Songti SC", "Noto Serif SC", "SimSun", serif;
}
header.page {
  padding: 24px 16px 12px; text-align: center;
  border-bottom: 3px double var(--line);
}
header.page h1 {
  margin: 0; font-size: 24px; letter-spacing: 0.3em; text-indent: 0.3em;
}
header.page p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
main.work {
  max-width: 720px; margin: 0 auto;
  padding: 20px clamp(20px, 6vw, 40px) calc(76px + env(safe-area-inset-bottom, 0));
}
main.work section.bio h3 {
  margin: 18px 0 6px; font-size: 15px; color: var(--muted);
  letter-spacing: 0.3em; font-weight: 400;
}
main.work section.bio p {
  margin: 8px 0; font-size: 18px; text-align: justify;
}
small { color: var(--muted); font-size: 0.62em; }
p.back { text-align: center; padding-bottom: 8px; }
p.back a { color: var(--muted); text-decoration: none; }
@media (max-width: 600px) {
  header.page { padding: 16px 12px 8px; }
  header.page h1 { font-size: 20px; letter-spacing: 0.25em; text-indent: 0.25em; }
  main.work section.bio p { font-size: 17px; }
}

</style>
</head>
<body>
<header class="page">
<h1>伯远帖</h1>
  <p>王珣</p>
</header>
<main class="work">
    <section class="bio">
      <h3>原文</h3>
      <p>珣顿<small>（頓）</small>首顿<small>（頓）</small>首，伯远<small>（遠）</small>胜<small>（勝）</small>业<small>（業）</small>情期，群<small>（羣）</small>从<small>（從）</small>之宝<small>（寶）</small>。自以羸患，志在优<small>（優）</small>游。始获<small>（獲）</small>此出，意不克申。分别<small>（別）</small>如昨，永为<small>（爲）</small>畴<small>（疇）</small>古。远<small>（遠）</small>隔岭<small>（嶺）</small>峤<small>（嶠）</small>，不相瞻临<small>（臨）</small>。</p>
    </section>
    <section class="bio">
      <h3>译文</h3>
      <p>王珣拜上再拜。伯远事业有成、正当盛年，是兄弟辈中的佼佼者。我自认为体弱多病，一心只想悠闲度日。刚获得这次出仕的机会，意愿却未能实现。分别仿佛就在昨天，转眼已成古人。如今远隔五岭千山，无法相互看望。</p>
    </section>
</main>
<p class="back"><a href="../index.html">← 返回书家谱</a></p>
</body>
</html>
