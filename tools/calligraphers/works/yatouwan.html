    <section class="bio">
      <h3>原文</h3>
      <p>鸭<small>（鴨）</small>头<small>（頭）</small>丸故不佳，明当<small>（當）</small>必集，当<small>（當）</small>与<small>（與）</small>君相见<small>（見）</small>。</p>
    </section>
    <section class="bio">
      <h3>译文</h3>
      <p>鸭头丸（这味药）效果确实不好，明天一定要聚会，到时当与你见面详谈。</p>
