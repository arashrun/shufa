  margin: 0; background: var(--paper); color: var(--ink);

<body>
<header class="page">
<h1>中秋帖</h1>
  <p>王献之</p>
</header>
<main class="work">
    <section class="bio">
      <h3>原文</h3>
      <p>中秋不复不得相还<small>（還）</small>为<small>（爲）</small>即甚省如何然胜<small>（勝）</small>人何庆<small>（慶）</small>等大军<small>（軍）</small>。</p>
    </section>
    <section class="bio">
      <h3>译文</h3>
      <p>（此帖为截取前人书迹连写而成，文意不能完全贯通。）大意谓：中秋过后不能再相聚，未能还家，心绪难解，将如何是好；然而胜过他人，有何可庆贺的，唯有等待大军的消息。</p>
    </section>
</main>
