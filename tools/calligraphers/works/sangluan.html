<h1>丧乱帖</h1>
  <p>王羲之</p>
</header>
<main class="work">
    <section class="bio">
      <h3>原文</h3>
      <p>羲之顿<small>（頓）</small>首。丧<small>（喪）</small>乱<small>（亂）</small>之极<small>（極）</small>，先墓再离<small>（離）</small>荼毒，追惟酷甚，号<small>（號）</small>慕摧绝<small>（絕）</small>，痛贯<small>（貫）</small>心肝，痛当<small>（當）</small>奈何奈何！虽<small>（雖）</small>即修复，未获<small>（獲）</small>奔驰<small>（馳）</small>，哀毒益深，奈何奈何！临<small>（臨）</small>纸<small>（紙）</small>感哽，不知何言。羲之顿<small>（頓）</small>首顿<small>（頓）</small>首。</p>
    </section>
    <section class="bio">
      <h3>译文</h3>
      <p>羲之拜上。世道丧乱到了极点，祖先的坟墓再次遭受摧残祸害。追想起来悲痛至极，哀号思慕，肝肠寸断，痛彻心肝，该怎么办才好啊！虽然祖坟随即得到修复，我却无法奔赴故里亲自料理，哀伤痛楚更加深重，可怎么办啊！面对信纸哽咽不已，不知道还能说什么。羲之拜上再拜。</p>
    </section>
