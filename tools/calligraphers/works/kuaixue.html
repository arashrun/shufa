<h1>快雪时晴帖</h1>
  <p>王羲之</p>
</header>
<main class="work">
    <section class="bio">
      <h3>原文</h3>
      <p>羲之顿<small>（頓）</small>首。快雪时<small>（時）</small>晴，佳想安善。未果为<small>（爲）</small>结<small>（結）</small>，力不次。王羲之顿<small>（頓）</small>首。山阴<small>（陰）</small>张<small>（張）</small>侯。</p>
    </section>
    <section class="bio">
      <h3>译文</h3>
      <p>羲之拜上。刚才下了一场大雪，转眼天又放晴，想必你那里一切都安好吧。上次说的事没有结果，未能如约，实在力不从心。王羲之拜上。此信送山阴张侯。</p>
    </section>
</main>
