  <p>杨凝式</p>
</header>
<main class="work">
    <section class="bio">
      <h3>原文</h3>
      <p>昼<small>（晝）</small>寝<small>（寢）</small>乍兴<small>（興）</small>，朝饥<small>（飢）</small>正甚，忽蒙简<small>（簡）</small>翰，猥赐<small>（賜）</small>盘<small>（盤）</small>飧。当<small>（當）</small>一叶<small>（葉）</small>报<small>（報）</small>秋之初，乃韭花逞味之始。助其肥羜，实<small>（實）</small>谓<small>（謂）</small>珍羞。充腹之余，铭<small>（銘）</small>肌载<small>（載）</small>切。谨<small>（謹）</small>修状<small>（狀）</small>陈<small>（陳）</small>谢<small>（謝）</small>，伏惟鉴<small>（鑑）</small>察。谨<small>（謹）</small>状<small>（狀）</small>。七月十一日状<small>（狀）</small>。</p>
    </section>
    <section class="bio">
      <h3>译文</h3>
      <p>午睡刚起，正是早晨饥饿之时，忽然收到您的信，承蒙赐下一盘饭食。正当一片落叶报知秋天的时节，又是韭菜花最够味的开始。用它来佐助肥美的小羊，实在称得上珍馐美馔。吃饱之余，感激之情铭刻于心。谨写此信致谢，敬请鉴察。谨状。七月十一日。</p>
    </section>
