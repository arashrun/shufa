name: Release Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # 推到 tag 时一定构建；推到分支时若未配置签名密钥则构建会在解密步骤明确报错。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            code="${GITHUB_REF_NAME#v}"
            name="${GITHUB_REF_NAME#v}"
          else
            git fetch --tags --force
            latest="$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)"
            code="$((latest + 1))"
            name="0.$code.0-${GITHUB_SHA::7}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: 解密签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > .signing/release.jks

      - name: 构建离线资源
        env:
          APP_FONT_BASE64: ${{ secrets.APP_FONT_BASE64 }}
        run: |
          if [ -n "$APP_FONT_BASE64" ]; then
            mkdir -p assets/fonts
            echo "$APP_FONT_BASE64" | base64 -d > assets/fonts/jxp.ttf
          fi
          npm ci
          npm run android:sync

      - name: 构建与签名 APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 校验签名与生成校验和
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "xingkai-recall-${APP_VERSION_CODE}.apk"
          sha256sum "xingkai-recall-${APP_VERSION_CODE}.apk" > "xingkai-recall-${APP_VERSION_CODE}.apk.sha256"

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tag="v${APP_VERSION_CODE}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              "xingkai-recall-${APP_VERSION_CODE}.apk" \
              "xingkai-recall-${APP_VERSION_CODE}.apk.sha256"
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "行楷忆写 ${APP_VERSION_NAME}" \
              --notes "提交 ${{ github.sha }} 自动构建" \
              "xingkai-recall-${APP_VERSION_CODE}.apk" \
              "xingkai-recall-${APP_VERSION_CODE}.apk.sha256"
          fi
